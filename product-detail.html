<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="UTF-8">
    <title>Tweets for Treats - Specifications</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/product.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<div class="row">
    <div class="col-sm-4 info-panel">
        <a href="http://www.tweetsfortreats.com"><img src="img/tweets-for-treats-logo.svg" alt="Tweets for Treats" class="logo"></a>

        <h2>Measurements</h2>
        <table border="0" cellpadding="0" cellspacing="0" class="stats">
            <tr>
                <td width="50%">Height</td>
                <td class="num">135 cm</td>
            </tr>
            <tr>
                <td width="50%">Width</td>
                <td class="num">33 cm</td>
            </tr>
            <tr>
                <td width="50%">Depth</td>
                <td class="num">36 cm</td>
            </tr>
        </table>
        <h2>Power</h2>
        <table border="0" cellpadding="0" cellspacing="0" class="stats">
            <tr>
                <td width="50%">UK 3 pin plug</td>
                <td class="num">240 volts</td>
            </tr>
            <tr>
                <td width="50%">Vintage Bulb</td>
                <td class="num">40 watts</td>
            </tr>
            <tr>
                <td width="50%">Power cable</td>
                <td class="num">2 metres</td>
            </tr>
        </table>
        <h2>Network</h2>
        <table border="0" cellpadding="0" cellspacing="0" class="stats">
            <tr>
                <td width="50%">Wifi</td>
                <td class="num">IEEE 802.11b/g/n</td>
            </tr>
            <tr>
                <td width="50%">Ethernet</td>
                <td class="num">IEEE 802.3 10/100Mbit/s</td>
            </tr>
        </table>
        <h2>Sweets</h2>
        <table border="0" cellpadding="0" cellspacing="0" class="stats">
            <tr>
                <td width="50%">Skittles 4kg</td>
                <td class="num">400 Tweets*</td>
            </tr>
        </table>
        <span class="footnote">
            *This figure can vary.
        </span>
    </div>
    <div class="col-sm-8 display-area">
        <div class="rotator-wrapper">
            <div id="rotator">
                <img class="rollerblade-img" src="img/machine/still1.jpg">
            </div>
        </div>


        <div id="menu">
            <div class="btn zoom-in">+</div>
            <div class="btn zoom-out">-</div>
        </div>

        <div id="drag-info">
            Drag to Rotate
        </div>
    </div>

</div>


<script src="js/jquery.1.11.1.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="https://hammerjs.github.io/dist/hammer.js"></script>
<script src="js/jquery.transit.js"></script>
<script src="js/rollerblade.js"></script>
<script src="js/wheelzoom.js"></script>
<script src="js/product.js"></script>
</body>
</html>
